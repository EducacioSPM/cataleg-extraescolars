name: Update catalog.json

on:
  workflow_dispatch:          # permet executar-ho manualment des de GitHub
  schedule:
    - cron: '*/15 * * * *'    # comprova canvis cada 15 minuts (repo públic = gratuït i il·limitat)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "DIAGNOSTIC - Descarrega catalog.json des de OneDrive"
        run: |
          echo "Codi HTTP rebut:"
          curl -sL -o response.txt -w "%{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "${{ secrets.CATALOG_JSON_URL }}"
          echo "---"
          echo "Primers 500 caràcters de la resposta:"
          head -c 500 response.txt

      - name: Valida que el JSON és correcte
        run: |
          python3 -m json.tool catalog.json.new > /dev/null

      - name: Compara i fes commit si hi ha canvis
        run: |
          if ! cmp -s catalog.json.new data/catalog.json 2>/dev/null; then
            mv catalog.json.new data/catalog.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json
            git commit -m "Actualitza catàleg [auto]"
            git push
          else
            echo "Sense canvis, no cal fer commit."
            rm -f catalog.json.new
          fi
