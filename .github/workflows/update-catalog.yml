name: Update catalog.json

on:
  workflow_dispatch:          # permet executar-ho manualment des de GitHub
  schedule:
    - cron: '*/5 * * * *'     # comprova canvis cada 5 minuts (repo públic = gratuït i il·limitat; mínim tècnic de GitHub Actions)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descarrega catalog.json des de Google Drive
        run: |
          curl -L -f -o catalog.json.new "${{ secrets.CATALOG_JSON_URL }}"

      - name: Valida que el JSON és correcte
        run: |
          python3 -m json.tool catalog.json.new > /dev/null

      - name: Compara i fes commit si hi ha canvis
        run: |
          if ! cmp -s catalog.json.new data/catalog.json 2>/dev/null; then
            mv catalog.json.new data/catalog.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json
            git commit -m "Actualitza catàleg [auto]"
            git push
          else
            echo "Sense canvis, no cal fer commit."
            rm -f catalog.json.new
          fi
